<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Lernspiel: Dezimalzahlen Memory</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-back: #2c3e50;
            --card-front: #ffffff;
            --text-color: #333;
            /* Farben für die Paare */
            --pair-1: #e74c3c; /* Rot */
            --pair-2: #f1c40f; /* Gelb */
            --pair-3: #9b59b6; /* Lila */
            --pair-4: #e67e22; /* Orange */
            --pair-5: #1abc9c; /* Türkis */
            --pair-6: #34495e; /* Blau-Grau */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .stats {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .memory-game {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 800px;
            grid-template-columns: repeat(4, 1fr);
        }

        @media (max-width: 600px) {
            .memory-game { grid-template-columns: repeat(3, 1fr); }
            h1 { font-size: 1.4rem; }
        }

        @media (max-width: 400px) {
            .memory-game { grid-template-columns: repeat(2, 1fr); }
        }

        .memory-card {
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform: scale(1);
            transform-style: preserve-3d;
            transition: transform 0.5s, opacity 1s ease-out, visibility 1s;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .memory-card.flip {
            transform: rotateY(180deg);
        }

        /* Effekt zum langsamen Verschwinden */
        .memory-card.vanish {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .front-face, .back-face {
            width: 100%;
            height: 100%;
            padding: 10px;
            position: absolute;
            border-radius: 8px;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 3px solid var(--accent-color);
        }

        .front-face {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            font-weight: 600;
            font-size: 1rem;
        }

        .front-face.text-small { font-size: 0.85rem; }

        .back-face {
            background-color: var(--card-back);
            color: white;
            font-size: 2rem;
        }
        .back-face::after { content: "?"; }

        /* Farbklassen für Paare (Lösungsmodus) */
        .pair-1 { border-color: var(--pair-1) !important; color: var(--pair-1); }
        .pair-2 { border-color: var(--pair-2) !important; color: var(--pair-2); }
        .pair-3 { border-color: var(--pair-3) !important; color: var(--pair-3); }
        .pair-4 { border-color: var(--pair-4) !important; color: var(--pair-4); }
        .pair-5 { border-color: var(--pair-5) !important; color: var(--pair-5); }
        .pair-6 { border-color: var(--pair-6) !important; color: var(--pair-6); }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-weight: bold;
        }

        .btn-reset { background-color: var(--accent-color); }
        .btn-reset:hover { background-color: #2980b9; }

        .btn-solution { background-color: #95a5a6; }
        .btn-solution:hover { background-color: #7f8c8d; }

        .win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
            text-align: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<header>
    <h1>Russisch: Dezimalzahlen Memory</h1>
    <p>Finde das Paar: Ziffer und russisches Wort</p>
</header>

<div class="stats">Paare gefunden: <span id="score">0</span> / 6</div>

<div class="memory-game" id="game-board"></div>

<div class="controls">
    <button class="btn-reset" onclick="resetGame()">Neu starten</button>
    <button class="btn-solution" id="solution-btn" onclick="showSolution()">Lösung anzeigen</button>
</div>

<div class="win-message" id="win-popup">
    <h2>Ausgezeichnet! 🎉</h2>
    <p>Alle Paare wurden korrekt zugeordnet.</p>
    <button class="btn-reset" onclick="resetGame()">Nochmal spielen</button>
</div>

<script>
    const cardsData = [
        { id: 1, content: '0,1' },
        { id: 1, content: 'ноль целых одна десятая' },
        { id: 2, content: '0,01' },
        { id: 2, content: 'ноль целых одна сотая' },
        { id: 3, content: '0,001' },
        { id: 3, content: 'ноль целых одна тысячная' },
        { id: 4, content: '0,2' },
        { id: 4, content: 'ноль целых две десятых' },
        { id: 5, content: '1,5' },
        { id: 5, content: 'одна целая пять десятых' },
        { id: 6, content: '2,31' },
        { id: 6, content: 'две целых тридцать одна сотая' }
    ];

    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let matches = 0;

    function createBoard() {
        const gameBoard = document.getElementById('game-board');
        gameBoard.innerHTML = '';
        
        // Karten mischen
        const shuffledCards = [...cardsData].sort(() => 0.5 - Math.random());
        
        shuffledCards.forEach(item => {
            const card = document.createElement('div');
            card.classList.add('memory-card');
            card.dataset.id = item.id;

            const isLongText = item.content.length > 15;
            
            card.innerHTML = `
                <div class="front-face pair-${item.id} ${isLongText ? 'text-small' : ''}">${item.content}</div>
                <div class="back-face"></div>
            `;
            
            card.addEventListener('click', flipCard);
            gameBoard.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flip');

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.id === secondCard.dataset.id;
        if (isMatch) {
            disableCards();
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        matches++;
        document.getElementById('score').textContent = matches;
        
        lockBoard = true; // Board sperren während des Verschwindens

        // Kurz warten, damit der User das Paar sieht, dann verschwinden lassen
        setTimeout(() => {
            firstCard.classList.add('vanish');
            secondCard.classList.add('vanish');
            
            resetBoard();
            
            if (matches === 6) {
                setTimeout(() => { document.getElementById('win-popup').style.display = 'block'; }, 1000);
            }
        }, 1000);

        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove('flip');
            secondCard.classList.remove('flip');
            resetBoard();
        }, 1200);
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    function showSolution() {
        if (lockBoard) return;
        lockBoard = true;
        
        const allCards = document.querySelectorAll('.memory-card');
        allCards.forEach(card => {
            card.classList.add('flip');
            // Karten im Lösungsmodus nicht verschwinden lassen
            card.classList.remove('vanish'); 
        });

        document.getElementById('solution-btn').style.opacity = "0.5";
        document.getElementById('solution-btn').disabled = true;
    }

    function resetGame() {
        matches = 0;
        document.getElementById('score').textContent = matches;
        document.getElementById('win-popup').style.display = 'none';
        document.getElementById('solution-btn').style.opacity = "1";
        document.getElementById('solution-btn').disabled = false;
        resetBoard();
        createBoard();
    }

    // Spielstart
    createBoard();
</script>

</body>
</html>
