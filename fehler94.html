<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch: Grammatik-Detektiv</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #f39c12;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s;
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        .instruction { color: #666; margin-bottom: 25px; font-size: 1rem; line-height: 1.4; }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-card {
            background: #fff;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            font-weight: 500;
            user-select: none;
            position: relative;
        }

        .option-card:hover {
            border-color: var(--accent-color);
            background-color: #fffaf0;
        }

        /* Wenn das falsche (der Fehler) angeklickt wurde -> Erfolg */
        .option-card.found-error {
            background-color: #d4edda;
            border-color: var(--correct-color);
            color: #155724;
        }

        /* Wenn ein richtiger Ausdruck fälschlicherweise markiert wurde */
        .option-card.not-an-error {
            background-color: #fdecea;
            border-color: var(--wrong-color);
            color: #721c24;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .feedback {
            margin-top: 20px;
            font-weight: bold;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .btn-next {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            width: 100%;
        }

        @media (max-width: 480px) {
            .container { padding: 15px; }
            .option-card { font-size: 1rem; padding: 12px; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <h1>Grammatik-Detektiv</h1>
        <p class="instruction">Finde den <b>Fehler</b>! Einer dieser vier Ausdrücke ist falsch geschrieben. Klicke ihn an.</p>

        <div class="options-list" id="options-container">
            <!-- Optionen werden hier geladen -->
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="btn-next" id="next-btn" onclick="nextLevel()">Nächste Aufgabe</button>
    </div>

    <script>
        const levels = [
            {
                options: [
                    { text: "ноль целых одна десятая", isError: false },
                    { text: "две целых одна десятых", isError: true, explanation: "Falsch! Nach 'одна' muss 'десятая' (Singular) stehen." },
                    { text: "пять целых две десятых", isError: false },
                    { text: "одна целая пять десятых", isError: false }
                ]
            },
            {
                options: [
                    { text: "один целая две сотых", isError: true, explanation: "Falsch! Es muss 'одна' (weiblich) heißen, da Zahlen immer weiblich sind." },
                    { text: "две целых три сотых", isError: false },
                    { text: "ноль целых fünf сотых", isError: false }, // "пять"
                    { text: "десять целых одна сотая", isError: false }
                ]
            },
            {
                options: [
                    { text: "три целых две десятых", isError: false },
                    { text: "две целая пять сотых", isError: true, explanation: "Falsch! Nach 'две' braucht man 'целых' (Genitiv Plural)." },
                    { text: "одна целая три десятых", isError: false },
                    { text: "ноль целых восемь десятых", isError: false }
                ]
            },
            {
                options: [
                    { text: "полтора бутерброда", isError: false },
                    { text: "полторы булочки", isError: false },
                    { text: "полтора яблока", isError: false },
                    { text: "полторы лимона", isError: true, explanation: "Falsch! 'лимон' ist männlich, daher muss es 'полтора' heißen." }
                ]
            },
            {
                options: [
                    { text: "дом 83 дробь 2", isError: false },
                    { text: "одна целая две тысячных", isError: false },
                    { text: "ноль целых одна тысячных", isError: true, explanation: "Falsch! Nach 'одна' folgt der Singular: 'тысячная'." },
                    { text: "две третьих торта", isError: false }
                ]
            },
            {
                options: [
                    { text: "четверть часа", isError: false },
                    { text: "три целых одна десятая", isError: false },
                    { text: "пять десятая", isError: true, explanation: "Falsch! Nach 'пять' muss Plural stehen: 'десятых'." },
                    { text: "половина яблока", isError: false }
                ]
            }
        ];

        let currentLevel = 0;
        let canClick = true;

        function loadLevel() {
            canClick = true;
            const level = levels[currentLevel];
            const container = document.getElementById('options-container');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');
            const progress = document.getElementById('progress');

            container.innerHTML = '';
            feedback.textContent = '';
            nextBtn.style.display = 'none';
            progress.style.width = (currentLevel / levels.length) * 100 + '%';

            // Optionen mischen
            const shuffledOptions = [...level.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.textContent = opt.text;
                card.onclick = () => handleSelection(card, opt);
                container.appendChild(card);
            });
        }

        function handleSelection(card, opt) {
            if (!canClick) return;

            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            if (opt.isError) {
                canClick = false;
                card.classList.add('found-error');
                feedback.textContent = "Richtig gefunden! " + opt.explanation;
                feedback.style.color = "var(--correct-color)";
                nextBtn.style.display = 'block';
            } else {
                card.classList.add('not-an-error');
                feedback.textContent = "Nein, dieser Ausdruck ist grammatikalisch korrekt. Such weiter!";
                feedback.style.color = "var(--wrong-color)";
                
                setTimeout(() => {
                    card.classList.remove('not-an-error');
                }, 800);
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel < levels.length) {
                loadLevel();
            } else {
                showFinal();
            }
        }

        function showFinal() {
            document.getElementById('progress').style.width = '100%';
            document.querySelector('.container').innerHTML = `
                <h2 style="color:var(--correct-color); margin-bottom:15px;">Hervorragend, Detektiv! 🔍</h2>
                <p>Du hast alle Grammatikfehler in den Bruchzahlen entlarvt.</p>
                <button class="btn-next" style="display:inline-block; margin-top:20px;" onclick="location.reload()">Neustart</button>
            `;
        }

        loadLevel();
    </script>
</body>
</html>
