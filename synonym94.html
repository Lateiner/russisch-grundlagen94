<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch: Synonym-Matching (8er-Match)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #16a085;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 { font-size: 1.6rem; margin-bottom: 5px; }
        .instruction { color: #7f8c8d; margin-bottom: 20px; font-size: 0.9rem; }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background: var(--card-bg);
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            min-height: 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            font-size: 1rem;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .match-card:hover:not(.matched) {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .match-card.selected {
            background-color: #e8f6f3;
            border-color: var(--accent-color);
            color: var(--accent-color);
            border-width: 3px;
        }

        .match-card.matched {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            transition: all 0.6s ease;
        }

        .match-card.wrong {
            background-color: #fdecea;
            border-color: var(--wrong-color);
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .hint { font-size: 0.75rem; font-weight: normal; color: #7f8c8d; margin-top: 4px; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--primary-color);
            color: white;
        }

        .btn-solution { background-color: #95a5a6; }

        #win-msg {
            display: none;
            font-size: 1.3rem;
            color: var(--correct-color);
            font-weight: bold;
            margin: 15px 0;
        }

        @media (max-width: 500px) {
            .match-card { font-size: 0.9rem; min-height: 60px; padding: 8px; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sonderformen: 8er-Match</h1>
        <p class="instruction">Finde die Paare: Wert/Symbol und russisches Synonym.</p>

        <div class="game-grid">
            <div class="column" id="left-col"></div>
            <div class="column" id="right-col"></div>
        </div>

        <div id="win-msg">Hervorragend! Alles korrekt zugeordnet. 🏆</div>

        <div class="controls">
            <button class="btn-solution" id="btn-solution" onclick="showSolution()">Lösung</button>
            <button onclick="resetGame()">Neustart</button>
        </div>
    </div>

    <script>
        const pairs = [
            { id: 1, left: "0,5", right: "половина", hint: "" },
            { id: 2, left: "0,25", right: "четверть", hint: "" },
            { id: 3, left: "0,33", right: "треть", hint: "" },
            { id: 4, left: "1,5", right: "полтора", hint: "männlich / sächlich" },
            { id: 5, left: "1,5", right: "полторы", hint: "weiblich" },
            { id: 6, left: "1/2", right: "половина", hint: "Symbol" },
            { id: 7, left: "1/4", right: "четверть", hint: "Symbol" },
            { id: 8, left: "1/3", right: "треть", hint: "Symbol" }
        ];

        let firstSelected = null;
        let secondSelected = null;
        let matchedCount = 0;

        function initGame() {
            const leftCol = document.getElementById('left-col');
            const rightCol = document.getElementById('right-col');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';
            matchedCount = 0;
            firstSelected = null;
            secondSelected = null;
            document.getElementById('win-msg').style.display = 'none';
            document.getElementById('btn-solution').disabled = false;
            document.getElementById('btn-solution').style.opacity = '1';

            // Links (Werte/Symbole) mischen
            const leftItems = [...pairs].sort(() => Math.random() - 0.5);
            // Rechts (Russische Wörter) mischen
            const rightItems = [...pairs].sort(() => Math.random() - 0.5);

            leftItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `<span>${item.left}</span>`;
                if(item.id === 4 || item.id === 5) card.innerHTML += `<div class="hint">(${item.hint.split(' ')[0]})</div>`;
                card.dataset.id = item.id;
                card.dataset.side = 'left';
                card.onclick = () => handleSelect(card);
                leftCol.appendChild(card);
            });

            rightItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `<span>${item.right}</span>`;
                if(item.hint && item.id < 6) card.innerHTML += `<div class="hint">${item.hint}</div>`;
                card.dataset.id = item.id;
                card.dataset.side = 'right';
                card.onclick = () => handleSelect(card);
                rightCol.appendChild(card);
            });
        }

        function handleSelect(card) {
            if (card.classList.contains('matched')) return;

            if (card.dataset.side === 'left') {
                if (firstSelected) firstSelected.classList.remove('selected');
                firstSelected = card;
            } else {
                if (secondSelected) secondSelected.classList.remove('selected');
                secondSelected = card;
            }
            card.classList.add('selected');

            if (firstSelected && secondSelected) {
                if (firstSelected.dataset.id === secondSelected.dataset.id) {
                    const c1 = firstSelected;
                    const c2 = secondSelected;
                    setTimeout(() => {
                        c1.classList.add('matched');
                        c2.classList.add('matched');
                    }, 200);
                    matchedCount++;
                    if (matchedCount === pairs.length) {
                        setTimeout(() => {
                            document.getElementById('win-msg').style.display = 'block';
                        }, 600);
                    }
                } else {
                    const c1 = firstSelected;
                    const c2 = secondSelected;
                    c1.classList.add('wrong');
                    c2.classList.add('wrong');
                    setTimeout(() => {
                        c1.classList.remove('wrong', 'selected');
                        c2.classList.remove('wrong', 'selected');
                    }, 500);
                }
                firstSelected = null;
                secondSelected = null;
            }
        }

        function showSolution() {
            resetGame();
            const leftCards = document.querySelectorAll('.column#left-col .match-card');
            const rightCards = document.querySelectorAll('.column#right-col .match-card');
            // 8 unterschiedliche Farben für die Paare
            const colors = ['#e67e22', '#9b59b6', '#3498db', '#e74c3c', '#16a085', '#f1c40f', '#d35400', '#2c3e50'];

            leftCards.forEach(l => {
                const id = parseInt(l.dataset.id);
                l.style.borderColor = colors[id - 1];
                l.style.borderWidth = '4px';
                rightCards.forEach(r => {
                    if (parseInt(r.dataset.id) === id) {
                        r.style.borderColor = colors[id - 1];
                        r.style.borderWidth = '4px';
                    }
                });
            });
            document.getElementById('btn-solution').disabled = true;
            document.getElementById('btn-solution').style.opacity = '0.5';
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
