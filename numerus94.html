<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch: Brüche Sofort-Check</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f0f4f8;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; }

        .instruction {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .stats {
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .fraction-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 450px) {
            .fraction-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .fraction-card {
            background: var(--card-bg);
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            position: relative;
        }

        .fraction-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .fraction-display .den {
            border-top: 2px solid var(--primary-color);
            padding-top: 2px;
        }

        /* Zustände nach Klick */
        .fraction-card.correct {
            background-color: #d4edda;
            border-color: var(--correct-color);
            color: #155724;
            pointer-events: none; /* Deaktivieren nach Erfolg */
        }

        .fraction-card.wrong {
            background-color: #f8d7da;
            border-color: var(--wrong-color);
            color: #721c24;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .feedback-message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 1.5em;
            transition: color 0.3s;
        }

        .btn-restart {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .rule-hint {
            font-size: 0.8rem;
            margin-top: 10px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Numerus-Check</h1>
        <div class="instruction">
            Klicke alle Brüche an, bei denen der Nenner im Russischen im <b>Plural</b> stehen muss.
        </div>

        <div class="stats">
            Gefundene Plural-Formen: <span id="found-count">0</span> / <span id="total-plural">0</span>
        </div>

        <div class="fraction-grid" id="grid"></div>

        <div class="feedback-message" id="feedback"></div>

        <div id="rule-info" class="rule-hint" style="display:none;">
            Hinweis: Steht oben eine 1 (одна), ist der Nenner Singular. Bei Zahlen > 1 ist er Plural.
        </div>

        <button class="btn-restart" onclick="initGame()">Neustart</button>
    </div>

    <script>
        const fractions = [
            { n: 1, d: 2, isPlural: false },
            { n: 2, d: 3, isPlural: true },
            { n: 1, d: 3, isPlural: false },
            { n: 3, d: 4, isPlural: true },
            { n: 1, d: 5, isPlural: false },
            { n: 4, d: 5, isPlural: true },
            { n: 2, d: 7, isPlural: true },
            { n: 1, d: 10, isPlural: false },
            { n: 5, d: 8, isPlural: true }
        ];

        let foundCount = 0;
        let totalPlural = 0;

        function initGame() {
            const grid = document.getElementById('grid');
            const feedback = document.getElementById('feedback');
            const ruleInfo = document.getElementById('rule-info');
            
            grid.innerHTML = '';
            feedback.textContent = '';
            feedback.style.color = 'inherit';
            ruleInfo.style.display = 'none';
            foundCount = 0;
            
            totalPlural = fractions.filter(f => f.isPlural).length;
            document.getElementById('total-plural').textContent = totalPlural;
            document.getElementById('found-count').textContent = '0';

            // Brüche mischen
            [...fractions].sort(() => Math.random() - 0.5).forEach(f => {
                const card = document.createElement('div');
                card.className = 'fraction-card';
                card.innerHTML = `
                    <div class="fraction-display">
                        <span>${f.n}</span>
                        <span class="den">${f.d}</span>
                    </div>
                `;
                card.onclick = () => handleSelection(card, f);
                grid.appendChild(card);
            });
        }

        function handleSelection(card, data) {
            const feedback = document.getElementById('feedback');
            const ruleInfo = document.getElementById('rule-info');

            if (data.isPlural) {
                // Richtig gewählt
                if (!card.classList.contains('correct')) {
                    card.classList.add('correct');
                    card.classList.remove('wrong');
                    foundCount++;
                    document.getElementById('found-count').textContent = foundCount;
                    feedback.textContent = "Richtig! Der Zähler ist " + data.n + ", also Plural.";
                    feedback.style.color = "var(--correct-color)";
                }
            } else {
                // Falsch gewählt (Singular erwischt)
                card.classList.add('wrong');
                feedback.textContent = "Falsch. Bei einer 1 im Zähler ist der Nenner Singular.";
                feedback.style.color = "var(--wrong-color)";
                ruleInfo.style.display = 'block';
                
                // Nach 1 Sekunde rote Farbe entfernen, um erneuten Versuch zu erlauben
                setTimeout(() => card.classList.remove('wrong'), 1000);
            }

            // Gewinn-Check
            if (foundCount === totalPlural) {
                feedback.textContent = "Super! Du hast alle Plural-Formen gefunden. 🎉";
                feedback.style.color = "var(--correct-color)";
            }
        }

        // Initialer Start
        initGame();
    </script>
</body>
</html>
